{% extends "base.html" %}

{% block extra_head %}
<style>
    /* Auth Page Container */
    .auth-container {
        min-height: calc(100vh - 200px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 5%;
        position: relative;
        z-index: 1;
    }

    /* Auth Card */
    .auth-card {
        max-width: 520px;
        width: 100%;
        background: var(--glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-xl);
        padding: 3rem 2.5rem;
        box-shadow: var(--shadow-xl);
        animation: fadeInUp 0.6s ease-out;
        position: relative;
        overflow: hidden;
    }

    .auth-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: var(--gradient-primary);
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Auth Header */
    .auth-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .auth-header h2 {
        font-family: 'Outfit', sans-serif;
        font-size: 2.2rem;
        font-weight: 800;
        margin-bottom: 0.8rem;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .auth-header p {
        color: var(--text-muted);
        font-size: 1rem;
    }

    /* Form Groups */
    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        margin-bottom: 0.6rem;
        font-weight: 600;
        color: var(--text-main);
        font-size: 0.9rem;
        letter-spacing: 0.3px;
    }

    .form-input {
        width: 100%;
        padding: 1rem 1.25rem;
        background: white;
        border: 2px solid rgba(148, 163, 184, 0.2);
        border-radius: var(--radius-sm);
        color: var(--text-main);
        font-size: 1rem;
        transition: all 0.3s ease;
        font-family: inherit;
    }

    .form-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        transform: translateY(-1px);
    }

    .form-input::placeholder {
        color: var(--text-light);
    }

    /* File Upload Area */
    .file-upload-wrapper {
        position: relative;
        margin-bottom: 1.5rem;
    }

    .file-upload-area {
        border: 2px dashed rgba(148, 163, 184, 0.3);
        border-radius: var(--radius-md);
        padding: 2.5rem 2rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.5);
        transition: all 0.3s ease;
        cursor: pointer;
        position: relative;
        overflow: hidden;
    }

    .file-upload-area:hover,
    .file-upload-area.drag-over {
        border-color: var(--primary);
        background: rgba(79, 70, 229, 0.05);
        transform: translateY(-2px);
    }

    .file-upload-icon {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        opacity: 0.6;
    }

    .file-upload-text {
        color: var(--text-main);
        margin-bottom: 0.5rem;
        font-weight: 600;
    }

    .file-upload-hint {
        font-size: 0.875rem;
        color: var(--text-muted);
    }

    .file-input {
        display: none;
    }

    .file-preview {
        margin-top: 1rem;
        padding: 1rem;
        background: rgba(79, 70, 229, 0.05);
        border-radius: var(--radius-sm);
        display: none;
        align-items: center;
        gap: 1rem;
        border: 1px solid rgba(79, 70, 229, 0.2);
    }

    .file-preview.active {
        display: flex;
        animation: slideIn 0.3s ease-out;
    }

    .file-preview-icon {
        font-size: 1.8rem;
    }

    .file-preview-info {
        flex: 1;
    }

    .file-preview-name {
        font-weight: 600;
        margin-bottom: 0.25rem;
        color: var(--text-main);
    }

    .file-preview-size {
        font-size: 0.875rem;
        color: var(--text-muted);
    }

    .file-preview-remove {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        font-size: 0.85rem;
    }

    .file-preview-remove:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
    }

    /* Auth Footer */
    .auth-footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid rgba(148, 163, 184, 0.2);
    }

    .auth-footer p {
        color: var(--text-muted);
        font-size: 0.95rem;
    }

    .auth-footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
        transition: all 0.3s ease;
    }

    .auth-footer a:hover {
        color: var(--primary-dark);
        text-decoration: underline;
    }

    /* Submit Button */
    .btn-submit {
        width: 100%;
        margin-top: 1.5rem;
        padding: 1rem 2rem;
        font-size: 1rem;
        font-weight: 700;
    }

    /* Responsive */
    @media (max-width: 640px) {
        .auth-card {
            padding: 2rem 1.5rem;
        }

        .auth-header h2 {
            font-size: 1.8rem;
        }

        .file-upload-area {
            padding: 2rem 1.5rem;
        }
    }
</style>
{% endblock %}

{% block main_class %}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Créer un compte</h2>
            <p>Rejoignez la communauté Etunav</p>
        </div>

        <form method="POST" enctype="multipart/form-data" id="registerForm">
            <div class="form-group">
                <label for="nom" class="form-label">Nom</label>
                <input type="text" id="nom" name="nom" class="form-input" required placeholder="Votre nom de famille">
            </div>

            <div class="form-group">
                <label for="prenom" class="form-label">Prénom</label>
                <input type="text" id="prenom" name="prenom" class="form-input" required placeholder="Votre prénom">
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-input" required
                    placeholder="votre.email@exemple.com">
            </div>

            <div class="form-group">
                <label for="nationalite" class="form-label">Nationalité</label>
                <select id="nationalite" name="nationalite" class="form-input" required>
                    <option value="">-- Veuillez choisir une nationalité --</option>
                    <option value="fr">🇫🇷 Française</option>
                    <option value="dz">🇩🇿 Algérienne</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" name="password" class="form-input" required
                    placeholder="Minimum 8 caractères" minlength="8">
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirmer le mot de passe</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" required
                    placeholder="Retapez votre mot de passe" minlength="8">
            </div>

            <div class="form-group">
                <label class="form-label">Justificatif étudiant (PDF, JPG, PNG)</label>
                <div class="file-upload-wrapper">
                    <div class="file-upload-area" id="fileUploadArea">
                        <div class="file-upload-icon">📄</div>
                        <div class="file-upload-text">Cliquez ou glissez votre justificatif ici</div>
                        <div class="file-upload-hint">PDF, JPG ou PNG - Max 16 MB</div>
                    </div>
                    <input type="file" name="document" id="fileInput" class="file-input" accept=".pdf,.jpg,.jpeg,.png"
                        required>
                    <div class="file-preview" id="filePreview">
                        <div class="file-preview-icon">📎</div>
                        <div class="file-preview-info">
                            <div class="file-preview-name" id="fileName"></div>
                            <div class="file-preview-size" id="fileSize"></div>
                        </div>
                        <button type="button" class="file-preview-remove" id="removeFile">Supprimer</button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-submit">
                <i data-lucide="user-plus" style="width: 20px; height: 20px;"></i>
                S'inscrire
            </button>
        </form>

        <div class="auth-footer">
            <p>Déjà un compte ? <a href="{{ url_for('login') }}">Connectez-vous</a></p>
        </div>
    </div>
</div>

<script>
    // Initialiser les icônes après le chargement
    document.addEventListener('DOMContentLoaded', function () {
        lucide.createIcons();

        // Password confirmation validation
        const registerForm = document.getElementById('registerForm');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm_password');

        registerForm.addEventListener('submit', function (e) {
            if (password.value !== confirmPassword.value) {
                e.preventDefault();
                alert('Les mots de passe ne correspondent pas. Veuillez vérifier.');
                confirmPassword.focus();
                return false;
            }
        });

        // Real-time password match feedback
        confirmPassword.addEventListener('input', function () {
            if (this.value !== password.value) {
                this.style.borderColor = '#f5576c';
            } else {
                this.style.borderColor = '#10b981';
            }
        });

        // File upload functionality
        const fileUploadArea = document.getElementById('fileUploadArea');
        const fileInput = document.getElementById('fileInput');
        const filePreview = document.getElementById('filePreview');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const removeFile = document.getElementById('removeFile');

        // Click to select file
        fileUploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag and drop
        fileUploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileUploadArea.classList.add('drag-over');
        });

        fileUploadArea.addEventListener('dragleave', () => {
            fileUploadArea.classList.remove('drag-over');
        });

        fileUploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            fileUploadArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelect(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        // Remove file
        removeFile.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.value = '';
            filePreview.classList.remove('active');
        });

        function handleFileSelect(file) {
            // Check file size (16 MB max)
            const maxSize = 16 * 1024 * 1024;
            if (file.size > maxSize) {
                alert('Le fichier est trop volumineux (max 16 MB)');
                return;
            }

            // Check extension
            const allowedExtensions = ['pdf', 'png', 'jpg', 'jpeg'];
            const extension = file.name.split('.').pop().toLowerCase();
            if (!allowedExtensions.includes(extension)) {
                alert('Type de fichier non autorisé. Utilisez PDF, PNG, JPG ou JPEG');
                return;
            }

            // Display preview
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            filePreview.classList.add('active');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
    });
</script>
{% endblock %}
